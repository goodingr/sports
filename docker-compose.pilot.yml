name: sports-interest-pilot

services:
  web:
    build:
      context: ./web-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: "https://${PILOT_DOMAIN:?Set PILOT_DOMAIN}"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set a Clerk publishable key}
        COMMERCIAL_PILOT_ONLY: "true"
        COMMERCIAL_PILOT_CONTACT_EMAIL: ${PILOT_CONTACT_EMAIL:?Set a working pilot contact email}
    image: sports-betting/interest-pilot:local
    restart: unless-stopped
    environment:
      COMMERCIAL_PILOT_ONLY: "true"
      COMMERCIAL_INTEREST_ENABLED: "true"
      COMMERCIAL_INTEREST_ENROLLMENT_CLOSED: "${COMMERCIAL_INTEREST_ENROLLMENT_CLOSED:-false}"
      COMMERCIAL_PILOT_CONTACT_EMAIL: ${PILOT_CONTACT_EMAIL:?Set a working pilot contact email}
      NEXT_PUBLIC_APP_URL: "https://${PILOT_DOMAIN:?Set PILOT_DOMAIN}"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set a Clerk publishable key}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /signup
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set the matching Clerk secret key}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/interest', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      PILOT_DOMAIN: ${PILOT_DOMAIN:?Set PILOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.pilot:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
