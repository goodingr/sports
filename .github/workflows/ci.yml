name: CI

on:
  push:
  pull_request:

# Stable lint/type-check scope is intentionally narrow: only files that pass
# cleanly. To expand, clean a file then add it to the lists below.
env:
  RUFF_SCOPE: >-
    src/data/ingest_sources.py
    src/data/ingest_nba_events.py
    src/data/audit_nba_schedule.py
    src/dashboard/schedule_audit.py
    src/features/betting_model_input.py
    src/models/betting_benchmark.py
    src/models/prediction_quality.py
    src/models/train_betting.py
    src/predict/publishable_bets.py
    src/predict/paper_approval.py
    src/predict/paper_close_poll.py
    src/predict/paper_coverage.py
    src/predict/paper_entry_poll.py
    src/predict/paper_ledger.py
    src/predict/paper_report.py
    src/predict/paper_schedule.py
    src/predict/paper_settlement.py
    src/predict/paper_settlement_history.py
    src/predict/published_ledger.py
    src/models/totals_calibration.py
    src/data/replay_local_odds.py
    src/api/settings.py
    scripts/backup_data.py
    scripts/backup_archive.py
    scripts/backup_evidence.py
    scripts/commercial_cash_report.py
    scripts/commercial_renewal_report.py
    scripts/paper_capture_health.py
    tests/test_betting_benchmark.py
    tests/test_betting_model_input.py
    tests/test_prediction_quality.py
    tests/test_publishable_bets.py
    tests/test_train_betting.py
    tests/api/test_readiness.py
  MYPY_SCOPE: >-
    src/data/ingest_sources.py
    src/data/ingest_nba_events.py
    src/data/audit_nba_schedule.py
    src/dashboard/schedule_audit.py
    src/data/sources/espn_odds.py
    src/data/sources/nba_injuries_espn.py
    src/features/betting_model_input.py
    src/models/feature_loader.py
    src/models/prediction_quality.py
    src/predict/publishable_bets.py
    src/predict/paper_approval.py
    src/predict/paper_close_poll.py
    src/predict/paper_coverage.py
    src/predict/paper_entry_poll.py
    src/predict/paper_ledger.py
    src/predict/paper_report.py
    src/predict/paper_schedule.py
    src/predict/paper_settlement.py
    src/predict/paper_settlement_history.py
    src/predict/published_ledger.py
    src/models/totals_calibration.py
    src/data/replay_local_odds.py
    src/api/settings.py
    scripts/backup_data.py
    scripts/backup_archive.py
    scripts/backup_evidence.py
    scripts/commercial_cash_report.py
    scripts/commercial_renewal_report.py
    scripts/paper_capture_health.py

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Ruff
        run: poetry run ruff check $RUFF_SCOPE

      - name: Mypy
        run: poetry run mypy $MYPY_SCOPE

      - name: Pytest
        run: poetry run pytest -q -rs

  release-gates:
    name: Release gates (betting + readiness)
    runs-on: ubuntu-latest
    needs: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Prediction quality
        run: poetry run pytest tests/test_prediction_quality.py -q -rs

      - name: Betting benchmark
        run: poetry run pytest tests/test_betting_benchmark.py -q -rs

      - name: Publishable bets
        run: poetry run pytest tests/test_publishable_bets.py -q -rs

      - name: Readiness (/ready) smoke
        run: poetry run pytest tests/api/test_readiness.py -q -rs

  worker-image:
    name: Backend image and paper worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start the worker with paper jobs enabled
        run: |
          docker build --tag sports-worker-ci .
          docker run --detach --name sports-worker-ci --network none --user 0:0 \
            --env 'WORKER_PREDICT_CRON=0 0 31 2 *' --env 'WORKER_TRAIN_CRON=0 0 31 2 *' \
            --env 'WORKER_BENCHMARK_CRON=0 0 31 2 *' --env 'WORKER_BACKUP_CRON=0 0 31 2 *' \
            --env 'WORKER_REMOTE_BACKUP_CRON=0 0 31 2 *' \
            --env WORKER_PAPER_CLOSE_ENABLED=1 --env WORKER_PAPER_ENTRY_ENABLED=1 \
            --env WORKER_PAPER_EVENTS_ENABLED=1 --entrypoint /usr/bin/tini \
            sports-worker-ci -- /app/scripts/worker_entrypoint.sh
          trap 'docker logs sports-worker-ci; docker rm -f sports-worker-ci >/dev/null' EXIT

          for attempt in {1..20}; do
            if docker exec sports-worker-ci /app/scripts/worker_health.sh; then break; fi
            sleep 1
          done
          docker exec sports-worker-ci /app/scripts/worker_health.sh

          for job in paper_close paper_entry paper_events; do
            docker exec sports-worker-ci grep -F "/app/scripts/run_job.sh $job" /etc/cron.d/sports
            docker exec --user app --workdir /tmp sports-worker-ci /app/scripts/run_job.sh "$job"
            docker exec sports-worker-ci test -f "/app/logs/heartbeat/$job.ok"
          done

  web:
    name: Web (lint, typecheck, unit, build, e2e)
    # Playwright 1.59 supports Ubuntu 24.04; ubuntu-latest has moved to 26.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Public placeholder for prerendering; this reserved domain has no Clerk instance.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmstY2kuZXhhbXBsZS5pbnZhbGlkJA==
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Interest pilot browser tests
        env:
          PLAYWRIGHT_PILOT: '1'
        run: npm run test:e2e

      - name: Interest pilot production build
        env:
          COMMERCIAL_PILOT_ONLY: 'true'
          COMMERCIAL_INTEREST_ENABLED: 'true'
          COMMERCIAL_INTEREST_ENROLLMENT_CLOSED: 'false'
          COMMERCIAL_PILOT_CONTACT_EMAIL: pilot-contact@example.invalid
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmstY2kuZXhhbXBsZS5pbnZhbGlkJA==
        run: npm run build

      - name: Validate interest pilot Compose configuration
        working-directory: .
        env:
          PILOT_DOMAIN: pilot.example.invalid
          PILOT_CONTACT_EMAIL: pilot-contact@example.invalid
          ACME_EMAIL: operator@example.invalid
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmstY2kuZXhhbXBsZS5pbnZhbGlkJA==
          CLERK_SECRET_KEY: ci-config-placeholder
        run: docker compose -f docker-compose.pilot.yml config --quiet

      - name: Validate full-stack Compose configuration
        working-directory: .
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Check private checkout storage across web containers
        working-directory: .
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmstY2kuZXhhbXBsZS5pbnZhbGlkJA==
        run: |
          docker compose build web
          docker compose run --rm --no-deps -T web node --input-type=module -e '
          import {closeSync, openSync} from "node:fs";
          import {DatabaseSync} from "node:sqlite";
          const path = process.env.SPORTS_CHECKOUT_DB_PATH;
          closeSync(openSync(path, "wx", 0o600));
          const db = new DatabaseSync(path);
          db.exec("PRAGMA user_version = 1");
          db.close();'
          docker compose run --rm --no-deps -T web node --input-type=module -e '
          import {strictEqual} from "node:assert";
          import {statSync} from "node:fs";
          import {DatabaseSync} from "node:sqlite";
          const path = process.env.SPORTS_CHECKOUT_DB_PATH;
          strictEqual(statSync(path).mode & 0o077, 0);
          const db = new DatabaseSync(path, {readOnly: true});
          strictEqual(db.prepare("PRAGMA user_version").get().user_version, 1);
          db.close();'
